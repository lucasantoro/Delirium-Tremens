<div class="bg-container bg-main-logo">
  <main class="panel guide-pdf-shell" id="reader">
    <div class="pdf-reader-toolbar" aria-label="Controlli lettore PDF">
      <a href="guide.html" class="button-secondary">Torna alle guide</a>
      <div class="pdf-reader-nav">
        <button type="button" class="guide-reader-btn" id="pdf-prev" aria-label="Pagina precedente">&#8592;</button>
        <label class="pdf-page-control">Pagina <input id="pdf-page-number" type="number" min="1" value="1" inputmode="numeric"> <span>/ <strong id="pdf-page-count">-</strong></span></label>
        <button type="button" class="guide-reader-btn" id="pdf-next" aria-label="Pagina successiva">&#8594;</button>
      </div>
      <div class="pdf-reader-actions">
        <button type="button" class="guide-reader-btn" id="pdf-zoom-out" aria-label="Riduci zoom">-</button>
        <span id="pdf-zoom-label">100%</span>
        <button type="button" class="guide-reader-btn" id="pdf-zoom-in" aria-label="Aumenta zoom">+</button>
        <button type="button" class="guide-reader-btn guide-reader-btn--text" id="pdf-spread">Vista doppia</button>
        <button type="button" class="guide-reader-btn guide-reader-btn--text" id="pdf-fullscreen">Schermo intero</button>
        <a class="team-btn" id="pdf-download" href="#" download>Scarica PDF</a>
      </div>
    </div>

    <div class="pdf-reader-status" id="pdf-reader-status" role="status">Caricamento documento...</div>
    <div class="pdf-book-stage" id="pdf-book-stage" aria-live="polite"></div>
    <div class="pdf-reader-progress" aria-hidden="true"><span id="pdf-reader-progress-bar"></span></div>
